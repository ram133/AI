<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Browser Chatbot</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 90vh; }
    .config { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="password"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    #chat-box { flex: 1; border: 1px solid #334155; background: #1e293b; border-radius: 8px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; width: fit-content; word-break: break-word; }
    .user { background: #2563eb; align-self: flex-end; }
    .ai { background: #334155; align-self: flex-start; }
    .input-row { display: flex; gap: 8px; margin-top: 12px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { padding: 12px 18px; border: none; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="config">
      <input type="password" id="key-input" placeholder="Paste Google AI Studio API Key">
      <button id="save-key">Save Key</button>
    </div>
    <div id="chat-box"></div>
    <div class="input-row">
      <input type="text" id="user-input" placeholder="Ask Gemini something...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const keyInput = document.getElementById('key-input');
    const saveBtn = document.getElementById('save-key');

    // Load stored key from localStorage
    keyInput.value = localStorage.getItem('gemini_key') || '';

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('gemini_key', keyInput.value.trim());
      alert('API Key Saved locally!');
    });

    // Main conversation history array
    const history = [];

    async function sendMessage() {
      const prompt = userInput.value.trim();
      const apiKey = keyInput.value.trim() || localStorage.getItem('gemini_key');

      if (!prompt) return;
      if (!apiKey) {
        alert('Please enter your Google AI Studio API key.');
        return;
      }

      // Render User Message
      appendMessage('user', prompt);
      userInput.value = '';
      sendBtn.disabled = true;

      // Append to ongoing context
      history.push({ role: 'user', parts: [{ text: prompt }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: history })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiText = data.candidates[0].content.parts[0].text;
        appendMessage('ai', aiText);

        // Store assistant response in context history
        history.push({ role: 'model', parts: [{ text: aiText }] });
      } catch (err) {
        appendMessage('ai', `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
