<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini API Request</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      padding: 12px;
      background: #f4f4f4;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Gemini API</h2>
  <textarea id="prompt" placeholder="Enter your prompt here..."></textarea><br>
  <button id="submitBtn" onclick="handleSubmit()">Send Request</button>

  <div id="output">Output will appear here...</div>

  <script>
    const API_KEY = "YOUR_API_KEY_HERE"; // Replace with your environment key
    const MODEL_NAME = "gemini-1.5-flash"; // Flash handles higher capacity than Pro

    async function fetchWithRetry(url, options, maxRetries = 3) {
      let delay = 1000; // Start with 1 second delay
      
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(url, options);
          const data = await response.json();

          if (response.ok) {
            return data;
          }

          // Check if response indicates temporary rate limit or high server load
          const isHighDemand = response.status === 503 || response.status === 429 || 
                               (data.error && data.error.message && data.error.message.includes("high demand"));

          if (isHighDemand && attempt < maxRetries) {
            document.getElementById("output").innerText = `Server busy. Retrying... (Attempt ${attempt + 1}/${maxRetries})`;
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2; // Exponential backoff (1s, 2s, 4s)
            continue;
          }

          throw new Error(data.error ? data.error.message : `HTTP error! status: ${response.status}`);
        } catch (error) {
          if (attempt === maxRetries) {
            throw error;
          }
        }
      }
    }

    async function handleSubmit() {
      const promptText = document.getElementById("prompt").value;
      const outputDiv = document.getElementById("output");
      const submitBtn = document.getElementById("submitBtn");

      if (!promptText) {
        outputDiv.innerText = "Please enter a prompt.";
        return;
      }

      outputDiv.innerText = "Processing...";
      submitBtn.disabled = true;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
      const payload = {
        contents: [{
          parts: [{ text: promptText }]
        }]
      };

      try {
        const result = await fetchWithRetry(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const textResponse = result.candidates[0].content.parts[0].text;
        outputDiv.innerText = textResponse;
      } catch (err) {
        outputDiv.innerText = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
